<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACEIT Watch — CS2 Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--card:#16161fcc;--border:#2a2a3a;--text:#e8e8f0;--text2:#8888aa;--text3:#55556a;--orange:#ff5500;--orange2:#ff8800;--green:#44ff88;--red:#ff4466;--blue:#4488ff;--purple:#9955ff;--gold:#ffd700;--glow:rgba(255,85,0,0.15);--font:'Inter',sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
        #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .bg-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;animation:floatOrb 15s ease-in-out infinite alternate}
        .bg-orb-1{width:500px;height:500px;top:-150px;left:-100px;background:rgba(255,85,0,0.08)}
        .bg-orb-2{width:400px;height:400px;bottom:-150px;right:-100px;background:rgba(153,85,255,0.06);animation-delay:-5s}
        .bg-orb-3{width:350px;height:350px;top:50%;left:50%;background:rgba(68,136,255,0.04);animation-delay:-10s}
        @keyframes floatOrb{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,-30px) scale(1.1)}}

        .header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--orange),var(--orange2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff}
        .logo-text{font-size:1.3rem;font-weight:800;color:var(--text)}
        .logo-text span{color:var(--orange)}
        .search-wrap{position:relative;width:400px}
        .search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 16px 10px 42px;color:var(--text);font-size:0.95rem;font-family:var(--font);outline:none;transition:0.2s}
        .search-input:focus{border-color:var(--orange);box-shadow:0 0 20px var(--glow)}
        .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:1rem}
        .search-results{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;max-height:300px;overflow-y:auto;display:none;z-index:200}
        .search-results.active{display:block}
        .search-result-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:0.15s;border-bottom:1px solid var(--border)}
        .search-result-item:last-child{border-bottom:none}
        .search-result-item:hover{background:var(--bg3)}
        .search-result-item img{width:32px;height:32px;border-radius:8px}
        .search-result-name{font-weight:600;font-size:0.9rem}
        .search-result-elo{font-size:0.8rem;color:var(--orange);font-weight:700}
        .header-actions{display:flex;gap:10px;align-items:center}
        .btn-add{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:var(--font);transition:0.2s;display:flex;align-items:center;gap:6px}
        .btn-add:hover{transform:translateY(-2px);box-shadow:0 4px 20px var(--glow)}

        .main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:30px 2rem}
        .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
        .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;backdrop-filter:blur(10px);transition:0.3s}
        .stat-card:hover{border-color:var(--orange);transform:translateY(-3px)}
        .stat-label{font-size:0.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
        .stat-value{font-size:1.8rem;font-weight:800}
        .stat-value.orange{color:var(--orange)}.stat-value.green{color:var(--green)}.stat-value.blue{color:var(--blue)}.stat-value.purple{color:var(--purple)}

        /* Tabs */
        .tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border-radius:12px;padding:4px;border:1px solid var(--border)}
        .tab-btn{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);font-size:0.9rem;font-weight:600;cursor:pointer;border-radius:8px;font-family:var(--font);transition:0.2s}
        .tab-btn:hover{color:var(--text);background:var(--bg3)}
        .tab-btn.active{background:linear-gradient(135deg,rgba(255,85,0,0.2),rgba(153,85,255,0.2));color:var(--text)}
        .tab-panel{display:none}.tab-panel.active{display:block}

        .section-title{font-size:1.4rem;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px}
        .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}

        /* Players grid */
        .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
        .player-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:0.3s;position:relative;overflow:hidden}
        .player-card:hover{border-color:var(--orange);transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
        .player-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--orange2),transparent)}
        .player-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
        .player-avatar{width:48px;height:48px;border-radius:12px;object-fit:cover;border:2px solid var(--border)}
        .player-info{flex:1}
        .player-nick{font-size:1.1rem;font-weight:700;margin-bottom:2px}
        .player-country{font-size:0.8rem;color:var(--text2)}
        .player-level{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;color:#fff}
        .lvl-1,.lvl-2{background:linear-gradient(135deg,#2a2a2a,#3a3a3a)}.lvl-3,.lvl-4{background:linear-gradient(135deg,#4a7a2a,#5a8a3a)}.lvl-5,.lvl-6{background:linear-gradient(135deg,#2a6a8a,#3a7a9a)}.lvl-7{background:linear-gradient(135deg,#6a2a8a,#7a3a9a)}.lvl-8{background:linear-gradient(135deg,#8a2a2a,#9a3a3a)}.lvl-9{background:linear-gradient(135deg,#8a6a2a,#9a7a3a)}.lvl-10{background:linear-gradient(135deg,#ff5500,#ff8800)}
        .player-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
        .player-stat{text-align:center}
        .player-stat-val{font-size:1rem;font-weight:700}
        .player-stat-label{font-size:0.65rem;color:var(--text3);text-transform:uppercase}
        .player-elo-bar{margin-bottom:10px}
        .elo-header{display:flex;justify-content:space-between;margin-bottom:4px}
        .elo-label{font-size:0.75rem;color:var(--text2)}
        .elo-value{font-size:0.85rem;font-weight:700;color:var(--orange)}
        .elo-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
        .elo-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
        .player-links{display:flex;gap:6px}
        .player-link{padding:5px 10px;border-radius:8px;font-size:0.7rem;font-weight:600;text-decoration:none;transition:0.2s;display:flex;align-items:center;gap:4px}
        .link-faceit{background:rgba(255,85,0,0.15);color:var(--orange)}.link-faceit:hover{background:rgba(255,85,0,0.3)}
        .link-steam{background:rgba(68,136,255,0.15);color:var(--blue)}.link-steam:hover{background:rgba(68,136,255,0.3)}
        .link-twitch{background:rgba(153,85,255,0.15);color:var(--purple)}.link-twitch:hover{background:rgba(153,85,255,0.3)}

        /* Compare table */
        .compare-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
        .compare-table th{background:var(--bg3);padding:12px 16px;text-align:left;font-size:0.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);position:sticky;top:0}
        .compare-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:0.9rem}
        .compare-table tr:hover td{background:rgba(255,85,0,0.05)}
        .compare-table .best{color:var(--green);font-weight:700}
        .compare-table .worst{color:var(--red)}

        /* Leaderboard */
        .lb-item{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;transition:0.2s;cursor:pointer}
        .lb-item:hover{border-color:var(--orange);transform:translateX(4px)}
        .lb-rank{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem}
        .lb-rank.gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000}
        .lb-rank.silver{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);color:#000}
        .lb-rank.bronze{background:linear-gradient(135deg,#cd7f32,#a0652a);color:#fff}
        .lb-rank.normal{background:var(--bg3);color:var(--text2)}
        .lb-info{flex:1}
        .lb-name{font-weight:700;font-size:1rem}
        .lb-sub{font-size:0.8rem;color:var(--text2)}
        .lb-value{font-size:1.2rem;font-weight:800}

        /* Modal */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:800px;max-height:90vh;overflow-y:auto;position:relative}
        .modal-close{position:absolute;top:16px;right:16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:1.2rem;transition:0.2s;z-index:10}
        .modal-close:hover{background:var(--red);color:#fff}
        .modal-header{padding:30px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
        .modal-avatar{width:80px;height:80px;border-radius:16px;object-fit:cover}
        .modal-name{font-size:1.6rem;font-weight:800}
        .modal-sub{font-size:0.9rem;color:var(--text2)}
        .modal-body{padding:24px}
        .modal-section{margin-bottom:24px}
        .modal-section-title{font-size:0.85rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
        .elo-chart{width:100%;height:200px;background:var(--bg);border-radius:12px;position:relative;overflow:hidden;padding:20px}
        .match-item{display:flex;align-items:center;gap:14px;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px}
        .match-result{padding:4px 10px;border-radius:6px;font-size:0.75rem;font-weight:700;min-width:50px;text-align:center}
        .match-win{background:rgba(68,255,136,0.15);color:var(--green)}.match-loss{background:rgba(255,68,102,0.15);color:var(--red)}
        .match-score{font-size:0.9rem;font-weight:600;flex:1}.match-map{font-size:0.8rem;color:var(--text2)}.match-time{font-size:0.75rem;color:var(--text3)}

        .loading{text-align:center;padding:40px;color:var(--text3)}
        .spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .toast{position:fixed;bottom:30px;right:30px;z-index:600;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:10px;transform:translateY(100px);opacity:0;transition:0.3s}
        .toast.show{transform:translateY(0);opacity:1}

        @media(max-width:768px){.stats-bar{grid-template-columns:repeat(2,1fr)}.players-grid{grid-template-columns:1fr}.search-wrap{width:100%}.header{padding:0 1rem}.main{padding:20px 1rem}.tabs{flex-wrap:wrap}.compare-table{font-size:0.8rem}}
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <header class="header">
        <div class="logo"><div class="logo-icon">F</div><div class="logo-text">FACEIT<span>Watch</span></div></div>
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Никнейм, Steam ссылка или Steam ID..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="header-actions">
            <button class="btn-add" id="btnAddPlayer">+ Добавить</button>
            <button class="btn-add" id="btnShare" style="background:linear-gradient(135deg,#4488ff,#9955ff)">🔗 Поделиться</button>
            <a href="https://www.donationalerts.com/r/miniksstudios" target="_blank" class="btn-add" style="background:linear-gradient(135deg,#ff5500,#ff8800);text-decoration:none">❤ Поддержать</a>
        </div>
    </header>

    <div class="main">
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-label">Игроков</div><div class="stat-value orange" id="statPlayers">0</div></div>
            <div class="stat-card"><div class="stat-label">Средний ELO</div><div class="stat-value green" id="statElo">0</div></div>
            <div class="stat-card"><div class="stat-label">Матчей</div><div class="stat-value blue" id="statMatches">0</div></div>
            <div class="stat-card"><div class="stat-label">Средний K/D</div><div class="stat-value purple" id="statKD">0</div></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('players', this)">Игроки</button>
            <button class="tab-btn" onclick="switchTab('compare', this)">Сравнение</button>
            <button class="tab-btn" onclick="switchTab('leaderboard', this)">Топ</button>
        </div>

        <!-- Players Tab -->
        <div class="tab-panel active" id="tab-players">
            <div class="players-grid" id="playersGrid">
                <div class="loading"><div class="spinner"></div><br>Загрузка игроков...</div>
            </div>
        </div>

        <!-- Compare Tab -->
        <div class="tab-panel" id="tab-compare">
            <div id="compareContent">
                <div class="loading"><div class="spinner"></div><br>Загрузка...</div>
            </div>
        </div>

        <!-- Leaderboard Tab -->
        <div class="tab-panel" id="tab-leaderboard">
            <div class="tabs" style="margin-bottom:20px;max-width:500px">
                <button class="tab-btn active" onclick="switchLB('elo')" id="lb-elo-btn">FACEIT ELO</button>
                <button class="tab-btn" onclick="switchLB('premier')" id="lb-premier-btn">Premier</button>
                <button class="tab-btn" onclick="switchLB('kd')" id="lb-kd-btn">K/D</button>
                <button class="tab-btn" onclick="switchLB('wr')" id="lb-wr-btn">Win Rate</button>
            </div>
            <div id="leaderboardContent">
                <div class="loading"><div class="spinner"></div><br>Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-close" id="modalClose">✕</div>
            <div class="modal-header">
                <img class="modal-avatar" id="modalAvatar" src="" alt="">
                <div>
                    <div class="modal-name" id="modalName">—</div>
                    <div class="modal-sub" id="modalSub">—</div>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <div class="modal-section-title">Статистика</div>
                    <div id="modalStats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">ELO — последние 50 матчей</div>
                    <div class="elo-chart"><canvas id="eloChart"></canvas></div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">История матчей</div>
                    <div id="modalMatches"></div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Ссылки</div>
                    <div id="modalLinks" class="player-links"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><span id="toastIcon">✓</span><span id="toastText">—</span></div>

    <script>
        const FACEIT_API_KEY = '28aaff41-edb1-442a-8cd7-c84e5e16c73b';
        const FACEIT_BASE = 'https://open.faceit.com/data/v4';
        const API_BASE = 'https://faceitwn-api.miniksstudio.workers.dev';

        let trackedPlayers = ['_kolzer_', 'minilstudio'];
        let playersData = {};
        let searchTimeout = null;

        // Load shared list from API
        async function initPlayerList() {
            try {
                const resp = await fetch(`${API_BASE}/api/players`, { cache: 'no-store' });
                if (resp.ok) {
                    const data = await resp.json();
                    if (Array.isArray(data) && data.length > 0) trackedPlayers = data;
                }
            } catch(e) { console.log('API load failed, using defaults'); }
            
            loadAllPlayers();
        }

        // Add player to shared list
        async function addPlayerShared(nick) {
            if (!nick || trackedPlayers.includes(nick)) return;
            trackedPlayers.push(nick);
            
            // Save to server
            try {
                await fetch(`${API_BASE}/api/players`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nick })
                });
            } catch(e) { console.error('Failed to save to API:', e); }
        }

        // Tabs
        function switchTab(name, el) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            if (el) el.classList.add('active');
            if (name === 'compare') renderCompare();
            if (name === 'leaderboard') renderLeaderboard('elo');
        }

        // Particles
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
        resizeCanvas();window.addEventListener('resize',resizeCanvas);
        let particles=[];
        function initParticles(){particles=[];for(let i=0;i<60;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+0.5,speedX:(Math.random()-0.5)*0.2,speedY:(Math.random()-0.5)*0.2,color:`rgba(255,${85+Math.random()*60},0,${Math.random()*0.3+0.05})`})}}
        initParticles();
        function animateParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.speedX;p.y+=p.speedY;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill()});for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(255,85,0,${0.05*(1-dist/100)})`;ctx.lineWidth=0.5;ctx.stroke()}}}requestAnimationFrame(animateParticles)}
        animateParticles();

        // API
        async function faceitFetch(endpoint){
            const resp=await fetch(`${FACEIT_BASE}${endpoint}`,{headers:{'Authorization':`Bearer ${FACEIT_API_KEY}`,'Accept':'application/json'}});
            if(!resp.ok)throw new Error(`API ${resp.status}`);
            return resp.json();
        }

        function extractSteamId(input){
            if(!input)return null;input=input.trim();
            if(/^7656119\d{10}$/.test(input))return input;
            const pm=input.match(/steamcommunity\.com\/profiles\/(7656119\d{10})/);
            if(pm)return pm[1];
            return null;
        }

        async function searchPlayers(query){
            if(!query||query.length<2)return[];
            try{
                const sid=extractSteamId(query);
                if(sid){try{return[await faceitFetch(`/players?game=cs2&game_player_id=${sid}`)]}catch(e){}}
                try{return[await faceitFetch(`/players?nickname=${encodeURIComponent(query)}&game=cs2`)]}catch(e){
                    try{const d=await faceitFetch(`/search/v1?query=${encodeURIComponent(query)}&game=cs2&limit=8`);return d?.items||d?.players?.items||[]}catch(e2){return[]}}
            }catch(e){return[]}
        }

        async function fetchCS2Ratings(steamId64){
            if(!steamId64)return null;
            try{
                const proxyUrl=`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://csstats.gg/player/${steamId64}`)}`;
                const resp=await fetch(proxyUrl,{signal:AbortSignal.timeout(8000)});
                if(!resp.ok)return null;
                const html=await resp.text();
                const ratings={premier:null,premierBest:null};
                const seasonRegex=/S(\d+)[\s\S]*?(\d{1,2},?\d{3,5})/g;
                let match,latestSeason=0;
                while((match=seasonRegex.exec(html))!==null){
                    const season=parseInt(match[1]);const rating=parseInt(match[2].replace(/,/g,''));
                    if(season>latestSeason&&rating>0&&rating<50000){latestSeason=season;ratings.premier=rating}}
                const bestMatch=html.match(/Best[\s\S]*?(\d{1,2},?\d{3,5})/);
                if(bestMatch)ratings.premierBest=parseInt(bestMatch[1].replace(/,/g,''));
                return ratings;
            }catch(e){return null}
        }

        // Cache system
        const CACHE_KEY = 'fw_cache';
        const CACHE_TTL = 5 * 60 * 1000; // 5 minutes
        
        function getCached(nick) {
            try {
                const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                const entry = cache[nick.toLowerCase()];
                if (entry && Date.now() - entry.ts < CACHE_TTL) return entry.data;
            } catch(e) {}
            return null;
        }
        
        function setCache(nick, data) {
            try {
                const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                cache[nick.toLowerCase()] = { data, ts: Date.now() };
                // Keep only last 50 entries
                const keys = Object.keys(cache);
                if (keys.length > 50) {
                    keys.sort((a, b) => cache[a].ts - cache[b].ts);
                    keys.slice(0, keys.length - 50).forEach(k => delete cache[k]);
                }
                localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
            } catch(e) {}
        }

        async function getPlayerData(nickname){
            // Check cache first
            const cached = getCached(nickname);
            if (cached) return cached;
            
            try{
                let details;
                try{details=await faceitFetch(`/players?nickname=${encodeURIComponent(nickname)}&game=cs2`)}catch(e){
                    const search=await faceitFetch(`/search/v1?query=${encodeURIComponent(nickname)}&game=cs2&limit=1`);
                    const player=(search?.items||search?.players?.items||[])[0];
                    if(!player)throw new Error('Player not found');
                    details=await faceitFetch(`/players/${player.player_id||player.guid}`)}
                if(!details||!details.player_id)throw new Error('Player not found');
                const playerId=details.player_id;
                
                // Fetch stats and matches in parallel
                const [stats, matchData] = await Promise.all([
                    faceitFetch(`/players/${playerId}/stats/cs2`).catch(() => null),
                    faceitFetch(`/players/${playerId}/history?game=cs2&offset=0&limit=50`).catch(() => ({items: []}))
                ]);
                
                const matches = matchData?.items || [];
                const result = {details, stats, matches, cs2Ratings: null, searchResult: {nickname: details.nickname}};
                
                // Cache immediately (without csstats)
                setCache(nickname, result);
                
                // Fetch Premier rating in background (don't block)
                const steamId = details?.steam_id_64 || details?.games?.cs2?.game_player_id || '';
                if (steamId) {
                    fetchCS2Ratings(steamId).then(ratings => {
                        if (ratings) {
                            result.cs2Ratings = ratings;
                            setCache(nickname, result);
                            // Update card if already rendered
                            const card = document.querySelector(`[data-nick="${details.nickname}"]`);
                            if (card) {
                                const premierEl = card.querySelector('.premier-badge');
                                if (premierEl && ratings.premier) {
                                    premierEl.textContent = ratings.premier.toLocaleString();
                                    premierEl.style.display = 'flex';
                                }
                            }
                        }
                    }).catch(() => {});
                }
                
                return result;
            }catch(e){console.error('Player load error:',e);return null}
        }

        // UI helpers
        function getLevelClass(l){return`lvl-${Math.min(Math.max(l||1,1),10)}`}
        function getEloColor(e){if(e>=2000)return'#ff5500';if(e>=1500)return'#9955ff';if(e>=1000)return'#4488ff';return'#44ff88'}
        function getEloWidth(e){return Math.min(Math.max((e/3000)*100,5),100)}
        function getFlag(c){if(!c||c.length!==2)return'';const code=c.toUpperCase();return String.fromCodePoint(...[...code].map(ch=>0x1F1E6+ch.charCodeAt(0)-65))}
        function timeAgo(ts){const diff=Date.now()/1000-ts;if(diff<60)return'только что';if(diff<3600)return`${Math.floor(diff/60)}м назад`;if(diff<86400)return`${Math.floor(diff/3600)}ч назад`;return`${Math.floor(diff/86400)}д назад`}

        function getStat(s,key,def='0'){return s?.lifetime?.[key]||def}
        function getStatN(s,key,def=0){return parseInt(s?.lifetime?.[key]||def)}

        function getPlayerStats(data){
            const d=data.details,s=data.stats;
            const elo=d?.games?.cs2?.faceit_elo||0;
            const level=d?.games?.cs2?.skill_level||0;
            const kd=getStat(s,'Average K/D Ratio','0');
            const hs=getStat(s,'Average Headshots %','0');
            const adr=getStat(s,'ADR','0');
            const kpr=getStat(s,'Average K/R Ratio','0');
            const totalMatches=getStatN(s,'Matches',0);
            const wins=getStatN(s,'Wins',0);
            const winRate=totalMatches>0?Math.round(wins/totalMatches*100):0;
            const v1c=getStatN(s,'Total 1v1 Count'),v1w=getStatN(s,'Total 1v1 Wins');
            const v2c=getStatN(s,'Total 1v2 Count'),v2w=getStatN(s,'Total 1v2 Wins');
            const clutchTotal=v1c+v2c,clutchWins=v1w+v2w;
            const clutchRate=clutchTotal>0?Math.round(clutchWins/clutchTotal*100):0;
            const totalRounds=getStatN(s,'Total Rounds with extended stats');
            const avgRounds=totalMatches>0?Math.round(totalRounds/totalMatches):0;
            const premier=data.cs2Ratings?.premier||null;
            const premierBest=data.cs2Ratings?.premierBest||null;
            const longestStreak=getStat(s,'Longest Win Streak','—');
            const entryRate=getStat(s,'Entry Rate','—');
            const entrySuccess=getStat(s,'Entry Success Rate','—');
            const avgKills=getStat(s,'Average Kills Per Match','—');
            const avgDeaths=getStat(s,'Average Deaths Per Match','—');
            const avgAssists=getStat(s,'Average Assists Per Match','—');
            return{elo,level,kd,hs,adr,kpr,totalMatches,wins,winRate,v1c,v1w,v2c,v2w,clutchRate,avgRounds,totalRounds,premier,premierBest,longestStreak,entryRate,entrySuccess,avgKills,avgDeaths,avgAssists};
        }

        // Render player card
        function renderPlayerCard(data){
            const d=data.details;

            return`<div class="player-card" id="${cardId}" data-nick="${nickname}">

                    <span style="font-size:0.7rem;color:#ffd700;font-weight:600">PREMIER</span>

                </div>
                <div class="player-stats-row">
                    <div class="player-stat"><div class="player-stat-val" style="color:var(--orange)">${st.elo}</div><div class="player-stat-label">ELO</div></div>
                    <div class="player-stat"><div class="player-stat-val">${st.kd}</div><div class="player-stat-label">K/D</div></div>
                    <div class="player-stat"><div class="player-stat-val">${st.hs}%</div><div class="player-stat-label">HS%</div></div>
                    <div class="player-stat"><div class="player-stat-val" style="color:${st.clutchRate>=30?'var(--green)':st.clutchRate>=20?'var(--blue)':'var(--text2)'}">${st.clutchRate}%</div><div class="player-stat-label">Clutch</div></div>
                </div>
                <div class="player-elo-bar"><div class="elo-header"><span class="elo-label">FACEIT ELO</span><span class="elo-value">${st.elo}</span></div><div class="elo-track"><div class="elo-fill" style="width:${getEloWidth(st.elo)}%;background:${getEloColor(st.elo)}"></div></div></div>
                <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:var(--text3);margin-bottom:8px"><span>Раундов/матч: ${st.avgRounds}</span><span>Clutch: ${st.clutchWins||0}/${st.clutchTotal||0}</span></div>
                <div class="player-links">
                    <a href="https://www.faceit.com/en/players/${encodeURIComponent(nickname)}" target="_blank" class="player-link link-faceit" onclick="event.stopPropagation()">FACEIT</a>
                    ${steamId?`<a href="https://steamcommunity.com/profiles/${steamId}" target="_blank" class="player-link link-steam" onclick="event.stopPropagation()">Steam</a>`:''}
                    ${twitchId?`<a href="https://twitch.tv/${twitchId}" target="_blank" class="player-link link-twitch" onclick="event.stopPropagation()">Twitch</a>`:''}
                </div>
            </div>`;
        }

        // Load all players
        async function loadAllPlayers(){
            const grid=document.getElementById('playersGrid');
            grid.innerHTML='<div class="loading"><div class="spinner"></div><br>Загрузка игроков...</div>';
            playersData={};
            
            try {
                // Load all players in parallel
                const promises = trackedPlayers.map(nick => getPlayerData(nick).catch(e => { console.error('Load error:', nick, e); return null; }));
                const results = (await Promise.all(promises)).filter(r => r !== null);
                
                if(results.length===0){grid.innerHTML='<div class="loading" style="color:var(--text3)">Добавьте игроков через поиск</div>';return}
                
                // Store data
                results.forEach(r => {
                    const nick = r.details?.nickname || r.searchResult?.nickname;
                    if (nick) { playersData[nick] = r; }
                    const tracked = trackedPlayers.find(t => t.toLowerCase() === nick?.toLowerCase());
                    if (tracked) playersData[tracked] = r;
                });
                
                grid.innerHTML=results.map(r=>renderPlayerCard(r)).join('');
                
                // Click listeners
                document.querySelectorAll('.player-card').forEach(card=>{
                    card.addEventListener('click',()=>{
                        const nick=card.dataset.nick;
                        let data=playersData[nick];
                        if(!data){const key=Object.keys(playersData).find(k=>k.toLowerCase()===nick.toLowerCase());if(key)data=playersData[key]}
                        if(data)openPlayerModal(nick,data);
                    })
                });
                updateStats(results);
            } catch(e) {
                console.error('loadAllPlayers error:', e);
                grid.innerHTML='<div class="loading" style="color:var(--red)">Ошибка загрузки. Попробуйте обновить страницу.</div>';
            }
        }

        function updateStats(results){
            document.getElementById('statPlayers').textContent=results.length;
            let totalElo=0,totalMatches=0,totalKD=0;
            results.forEach(r=>{const s=getPlayerStats(r);totalElo+=s.elo;totalMatches+=s.totalMatches;totalKD+=parseFloat(s.kd)||0});
            document.getElementById('statElo').textContent=results.length?Math.round(totalElo/results.length):0;
            document.getElementById('statMatches').textContent=totalMatches;
            document.getElementById('statKD').textContent=results.length?(totalKD/results.length).toFixed(2):'0';
        }

            const bestKD=Math.max(...stats.map(s=>parseFloat(s.kd)||0));
            const bestHS=Math.max(...stats.map(s=>parseInt(s.hs)||0));

            </table>`;

        // ELO chart
        function drawEloChart(matches,playerId){
            const canvas=document.getElementById('eloChart');const ctx=canvas.getContext('2d');
            canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;ctx.scale(2,2);
            const w=canvas.offsetWidth,h=canvas.offsetHeight;ctx.clearRect(0,0,w,h);
            const results=[];[...matches].reverse().slice(0,50).forEach(m=>{
                const teams=m?.teams||{};const f1=teams?.faction1;const winner=m?.results?.winner;
                const isF1=f1?.players?.some(p=>p?.player_id===playerId)||f1?.team_id===playerId;
                results.push({won:(isF1&&winner==='faction1')||(!isF1&&winner==='faction2')});
            });
            if(results.length<1){ctx.fillStyle='#55556a';ctx.font='14px Inter';ctx.textAlign='center';ctx.fillText('Нет данных',w/2,h/2);return}
            const eloData=[];let cur=1000;
            results.forEach(r=>{cur+=r.won?25:-25;eloData.push({elo:Math.max(0,cur),won:r.won})});
            const min=Math.min(...eloData.map(d=>d.elo))-30,max=Math.max(...eloData.map(d=>d.elo))+30;
            const barW=Math.max(4,(w-40)/eloData.length-2),chartH=h-40;
            ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
            for(let i=0;i<5;i++){const y=20+(chartH/5)*i;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-10,y);ctx.stroke();
                ctx.fillStyle='#55556a';ctx.font='10px Inter';ctx.textAlign='right';ctx.fillText(Math.round(max-((max-min)/5)*i),26,y+4)}
            eloData.forEach((d,i)=>{const x=30+i*((w-40)/eloData.length)+1;const barH=((d.elo-min)/(max-min))*chartH;const y=20+chartH-barH;
                const g=ctx.createLinearGradient(x,y,x,20+chartH);g.addColorStop(0,d.won?'#44ff88':'#ff4466');g.addColorStop(1,d.won?'#22aa55':'#aa2244');
                ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,barW,barH,[3,3,0,0]);ctx.fill()});
            const last=eloData[eloData.length-1]?.elo||0;const lastY=20+chartH-((last-min)/(max-min))*chartH;
            ctx.strokeStyle='#ff5500';ctx.lineWidth=1;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(30,lastY);ctx.lineTo(w-10,lastY);ctx.stroke();
            ctx.setLineDash([]);ctx.fillStyle='#ff5500';ctx.font='bold 11px Inter';ctx.textAlign='left';ctx.fillText(`ELO: ${last}`,w-50,lastY-5);
        }

        // Search
        const searchInput=document.getElementById('searchInput'),searchResults=document.getElementById('searchResults');
        searchInput.addEventListener('input',()=>{clearTimeout(searchTimeout);const q=searchInput.value.trim();if(q.length<2){searchResults.classList.remove('active');return}
            searchTimeout=setTimeout(async()=>{const results=await searchPlayers(q);if(results.length===0){searchResults.classList.remove('active');return}
                searchResults.innerHTML=results.map(p=>`<div class="search-result-item" data-nick="${p.nickname||p.name}"><img src="${p.avatar||'https://via.placeholder.com/32'}" alt="" onerror="this.src='https://via.placeholder.com/32'"><div style="flex:1"><div class="search-result-name">${p.nickname||p.name}</div><div style="font-size:0.75rem;color:var(--text3)">${p.country||''} • ${p.games?.cs2?.skill_level||'?'} lvl</div></div><div class="search-result-elo">${p.games?.cs2?.faceit_elo||'—'} ELO</div></div>`).join('');
                searchResults.classList.add('active');
                searchResults.querySelectorAll('.search-result-item').forEach(el=>{el.addEventListener('click',()=>{const nick=el.dataset.nick;if(nick&&!trackedPlayers.includes(nick)){addPlayerShared(nick);loadAllPlayers();showToast('✓',`${nick} добавлен для всех`)}searchResults.classList.remove('active');searchInput.value=''})});
            },400)});
        document.addEventListener('click',(e)=>{if(!e.target.closest('.search-wrap'))searchResults.classList.remove('active')});

        // Add player
        document.getElementById('btnAddPlayer').addEventListener('click',()=>{
            const nick=prompt('Введите никнейм, Steam ссылку или Steam ID:');
            if(nick&&nick.trim()){const n=nick.trim();if(!trackedPlayers.includes(n)){addPlayerShared(n);loadAllPlayers();showToast('✓',`${n} добавлен для всех`)}else{showToast('ℹ',`${n} уже отслеживается`)}}});

        // Share
        document.getElementById('btnShare').addEventListener('click',()=>{navigator.clipboard.writeText(window.location.href).then(()=>showToast('✓','Ссылка скопирована!')).catch(()=>prompt('Скопируйте:',window.location.href))});

        // Toast
        function showToast(icon,text){document.getElementById('toastIcon').textContent=icon;document.getElementById('toastText').textContent=text;const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

        // Init
        initPlayerList();
        setInterval(loadAllPlayers,120000);
    </script>
</body>
</html>
